<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
    xmlns:svg="http://www.w3.org/2000/svg"
    xmlns="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink"
    width="1200"
    height="630"
    viewBox="0 0 1200 630"
    version="1.1"
    id="svg8">
    <defs id="defs2">
        <rect id="textbox" x="60" y="555" width="1080" height="70" />
    </defs>
    <!-- Site style: plain white, black Georgia serif, like the blog CSS (font: 14px/20px Georgia,serif) -->
    <rect id="background" width="1200" height="630" x="0" y="0" style="fill:#ffffff" />
    <text id="site-title" x="60" y="90" style="font-style:normal;font-weight:normal;font-size:40px;line-height:1.2;font-family:Georgia,'Libre Baskerville',serif;fill:#000000;fill-opacity:1;stroke:none">Hässliche Plastiktiere und Zeugs</text>
    <image id="preview-image" xlink:href="" y="130" x="100" style="image-rendering:optimizeQuality" preserveAspectRatio="xMidYMid meet" height="380" width="1000"/>
    <line id="title-rule" x1="60" y1="540" x2="1140" y2="540" style="stroke:#000000;stroke-width:2" />
    <text id="text-container" xml:space="preserve" style="shape-inside:url(#textbox);font-style:normal;font-weight:normal;font-size:56px;line-height:1.25;font-family:Georgia,'Libre Baskerville',serif;text-align:center;white-space:pre;fill:#000000;fill-opacity:1;stroke:none" > </text>
</svg>
